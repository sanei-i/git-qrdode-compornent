<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | QR code component</title>

</head>
<body>

  <section class="qrcode">
    <figure class="qdcode-image">
      <img src="images/image-qr-code.png" alt="qrcode image">
      <figcaption class="qrcode-caption">
        <h1 class="qrcode-headline">
          Improve your front-end <br>
          skills by building projects
        </h1>
        <p class="qrcode-description">
          scan the QR code to code to visit Frontend <br>
          Mentor and take your coding skills to <br>
          the next level
        </p>
      </figcaption>
    </figure>
  </section>

  Improve your front-end skills by building projects

  Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
